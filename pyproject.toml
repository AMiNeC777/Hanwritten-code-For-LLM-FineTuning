[project]
name = "hanwritten-code-for-llm-finetuning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ghouf", email = "ghouf@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "arabic-emojipedia>=1.0.4",
    "emoji>=2.16.0",
    "emojis>=0.7.0",
    "googletrans>=4.0.2",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pyarabic>=0.6.15",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[project.scripts]
hanwritten-code-for-llm-finetuning = "hanwritten_code_for_llm_finetuning:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
